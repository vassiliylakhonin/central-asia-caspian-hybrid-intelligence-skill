name: validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Validate specialist-lift suite
        run: python3 evals/specialist-lift/tools/validate_lift.py
      - name: Install package on a clean runner
        run: python3 -m pip install -e .
      - name: Test packaging invariants and the unavailable MCP contract
        run: python3 -m unittest discover -s tests -v
