[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "central-asia-caspian-compliance-server"
version = "0.2.0"
description = "MCP server skeleton for the regional compliance skill (tools are not implemented)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.0.0"
]

[project.scripts]
central-asia-caspian-compliance-server = "central_asia_caspian_compliance_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
